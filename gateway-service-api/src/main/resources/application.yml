server:
  port: 8090
spring:
  application:
    name: gateway-service-api
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service-api
          uri: lb://USER-SERVICE-API
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: shopping-service-api
          uri: lb://SHOPPING-SERVICE-API
          predicates:
            - Path=/api/shopping/**


        - id: product-service-api
          uri: lb://PRODUCT-SERVICE-API
          predicates:
            - Path=/api/product/**


        - id: order-service-api
          uri: lb://ORDER-SERVICE-API
          predicates:
            - Path=/api/orders/**


        - id: notification-service-api
          uri: lb://NOTIFICATION-SERVICE-API
          predicates:
            - Path=/api/notifications/**


eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /api/auth/v3/api-docs
      - name: Product Service
        url: /api/product/v3/api-docs
      - name: Shopping Service
        url: /api/shopping/v3/api-docs
      - name: Order Service
        url: /api/orders/v3/api-docs
