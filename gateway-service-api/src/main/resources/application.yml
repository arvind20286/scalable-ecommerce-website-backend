server:
  port: 8090
spring:
  application:
    name: gateway-service-api
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://127.0.0.1:5173"
              - "http://localhost:8080"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service-api
          uri: lb://USERS-SERVICE-API
          predicates:
            - Path=/api/auth/**

        - id: user-service-users
          uri: lb://USERS-SERVICE-API
          predicates:
            - Path=/api/users/**

        - id: shopping-service-api
          uri: lb://SHOPPING-SERVICE-API
          predicates:
            - Path=/api/shopping/**


        - id: product-service-api
          uri: lb://PRODUCT-SERVICE-API
          predicates:
            - Path=/api/product/**


        - id: order-service-api
          uri: lb://ORDER-SERVICE-API
          predicates:
            - Path=/api/orders/**

        - id: payment-service-api
          uri: lb://PAYMENT-SERVICE-API
          predicates:
            - Path=/api/payment/**


        - id: notification-service-api
          uri: lb://NOTIFICATION-SERVICE-API
          predicates:
            - Path=/api/notifications/**


eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: User Service
        url: /api/auth/v3/api-docs
      - name: Product Service
        url: /api/product/v3/api-docs
      - name: Shopping Service
        url: /api/shopping/v3/api-docs
      - name: Order Service
        url: /api/orders/v3/api-docs
