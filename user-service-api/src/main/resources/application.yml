server:
  port: 8081
spring:
  application:
    name: user-service-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      ssl:
        enabled: false
  cache:
    type: redis


jwt:
  secret: 3E3U3HR23GR627GR27723RY23IJR923R2379HRRJK934
  expiration: 604800000
springdoc:
  api-docs:
    # This moves the JSON generation path
    path: /api/auth/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST}:${EUREKA_PORT}/eureka
  instance:
    prefer-ip-address: true
